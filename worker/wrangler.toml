name = "gptmarketplus-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database bindings
[[d1_databases]]
binding = "DB"
database_name = "gptmarketplus-db"
database_id = "placeholder-database-id"

# R2 Storage bindings
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "gptmarketplus-storage"

# KV Namespace bindings
[[kv_namespaces]]
binding = "CACHE"
id = "placeholder-kv-id"

[[kv_namespaces]]
binding = "SESSIONS"
id = "placeholder-sessions-kv-id"

# Environment variables (secrets managed via wrangler secret)
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
CORS_ORIGINS = "https://gptmarketplus.pages.dev"

# Note: Secrets are NOT stored here. Use: wrangler secret put STRIPE_SECRET_KEY
# Required secrets:
# - STRIPE_SECRET_KEY
# - STRIPE_WEBHOOK_SECRET
# - JWT_SECRET
