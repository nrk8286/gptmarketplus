name: Verify Legacy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify Worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Audit production dependencies
        working-directory: worker
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        working-directory: worker
        run: npm run typecheck

      - name: Lint
        working-directory: worker
        run: npm run lint

      - name: Test
        working-directory: worker
        run: npm test -- --passWithNoTests

      - name: Explain deployment status
        run: |
          echo "Deployment is intentionally disabled while worker/wrangler.toml contains placeholder resource IDs."
          echo "Provision the D1 and KV resources, replace every placeholder, and review the service against the active production Worker before restoring deploy permissions."
